<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Salad Chatt • Account</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <div class="badge">🥗</div>
        <div>
          <div class="h1">Account</div>
          <div class="sub">Your Salad Chatt profile</div>
        </div>
      </div>
      <div class="status" id="status">Loading…</div>
    </header>

    <main class="single">
      <section class="card cardWide">

        <!-- CREATE VIEW -->
        <div id="createView" class="hidden">
          <div class="cardTitle">Create Account</div>

          <label class="lbl" for="name">Name</label>
          <input id="name" class="inp" maxlength="20" placeholder="e.g. FrostCube" autocomplete="name" />

          <div class="row">
            <button id="createBtn" class="btn primary">Create account</button>
            <button id="goChatsBtnA" class="btn" disabled>Go to chats</button>
          </div>

          <div class="hint" id="hintA"></div>

          <div class="small">
            This generates a unique 10-digit ID like a phone number. Share it so friends can DM you.
          </div>
        </div>

        <!-- PROFILE VIEW -->
        <div id="profileView" class="hidden">
          <div class="cardTitle">Profile</div>

          <div class="centerWrap">
            <div class="bigName" id="pName">—</div>
            <div class="bigId mono" id="pId">—</div>
          </div>

          <div class="aboutBox">
            <strong>About</strong><br />
            <div id="aboutText" style="margin-top:6px;">—</div>
          </div>

          <div class="divider"></div>

          <div class="row">
            <button id="copyIdBtn" class="btn">Copy ID</button>
            <button id="editBtn" class="btn primary">Modify name</button>
            <button id="editAboutBtn" class="btn">Modify about</button>
            <button id="goChatsBtnB" class="btn">Go to chats</button>
          </div>

          <div class="row">
            <button id="deleteBtn" class="btn danger">Delete account</button>
          </div>

          <div class="hint" id="hintB"></div>

          <!-- EDIT NAME -->
          <div id="editView" class="hidden">
            <div class="divider"></div>

            <label class="lbl" for="newName">New name</label>
            <input id="newName" class="inp" maxlength="20" placeholder="Enter new name" autocomplete="name" />

            <div class="row">
              <button id="saveNameBtn" class="btn primary">Save</button>
              <button id="cancelEditBtn" class="btn">Cancel</button>
            </div>

            <div class="hint" id="hintC"></div>
          </div>

          <!-- EDIT ABOUT -->
          <div id="aboutEditView" class="hidden">
            <div class="divider"></div>

            <label class="lbl" for="newAbout">About (max 160)</label>
            <textarea id="newAbout" class="inp" rows="4" maxlength="160"
              placeholder="Write a short description (max 160 characters)"></textarea>

            <div class="row">
              <button id="saveAboutBtn" class="btn primary">Save</button>
              <button id="cancelAboutBtn" class="btn">Cancel</button>
            </div>

            <div class="hint" id="hintD"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    /* ===== PASTE YOUR FIREBASE CONFIG HERE (same as app.js) ===== */
    const firebaseConfig = {
  apiKey: "AIzaSyDrZ-maG46ecU5Fgidqyrws1DdNoEfqeFI",
  authDomain: "salad-chatt.firebaseapp.com",
  projectId: "salad-chatt",
  storageBucket: "salad-chatt.firebasestorage.app",
  messagingSenderId: "841208847669",
  appId: "1:841208847669:web:568e254429166d05c2c07c",
  measurementId: "G-FFF48MW8EL"
};
    /* =========================================================== */

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const el = (id) => document.getElementById(id);

    const statusEl = el("status");
    const createView = el("createView");
    const profileView = el("profileView");
    const editView = el("editView");
    const aboutEditView = el("aboutEditView");

    const hintA = el("hintA");
    const hintB = el("hintB");
    const hintC = el("hintC");
    const hintD = el("hintD");

    const nameEl = el("name");
    const createBtn = el("createBtn");
    const goChatsBtnA = el("goChatsBtnA");

    const pName = el("pName");
    const pId = el("pId");
    const aboutTextEl = el("aboutText");

    const copyIdBtn = el("copyIdBtn");
    const editBtn = el("editBtn");
    const editAboutBtn = el("editAboutBtn");
    const goChatsBtnB = el("goChatsBtnB");
    const deleteBtn = el("deleteBtn");

    const newNameEl = el("newName");
    const saveNameBtn = el("saveNameBtn");
    const cancelEditBtn = el("cancelEditBtn");

    const newAboutEl = el("newAbout");
    const saveAboutBtn = el("saveAboutBtn");
    const cancelAboutBtn = el("cancelAboutBtn");

    function setHint(node, t){ node.textContent = t || ""; }

    function loadLocalUser(){
      try { return JSON.parse(localStorage.getItem("salad_user_v1") || "null"); }
      catch { return null; }
    }
    function saveLocalUser(u){
      localStorage.setItem("salad_user_v1", JSON.stringify(u));
    }
    function clearLocalUser(){
      localStorage.removeItem("salad_user_v1");
    }

    async function generateUnique10DigitId(){
      for (let i=0; i<10; i++){
        const id = String(Math.floor(1000000000 + Math.random()*9000000000));
        const ref = doc(db, "users", id);
        const snap = await getDoc(ref);
        if (!snap.exists()) return id;
      }
      throw new Error("Could not generate a unique ID. Try again.");
    }

    function showCreate(){
      statusEl.textContent = "Not registered";
      createView.classList.remove("hidden");
      profileView.classList.add("hidden");
      editView.classList.add("hidden");
      aboutEditView.classList.add("hidden");
      goChatsBtnA.disabled = true;
      setHint(hintA, "");
    }

    function showProfile(user){
      statusEl.textContent = "Registered";
      createView.classList.add("hidden");
      profileView.classList.remove("hidden");
      editView.classList.add("hidden");
      aboutEditView.classList.add("hidden");

      pName.textContent = user.name;
      pId.textContent = user.id;
      aboutTextEl.textContent = (user.about && user.about.trim()) ? user.about : "No description yet.";

      goChatsBtnA.disabled = false;
      setHint(hintB, "");
      setHint(hintC, "");
      setHint(hintD, "");
    }

    function showEditName(user){
      editView.classList.remove("hidden");
      newNameEl.value = user.name || "";
      newNameEl.focus();
    }

    function showEditAbout(user){
      aboutEditView.classList.remove("hidden");
      newAboutEl.value = user.about || "";
      newAboutEl.focus();
    }

    // Wrap in async so we can refresh profile from Firestore
    (async () => {
      let user = loadLocalUser();

      if (user?.id && user?.name) {
        // Refresh from Firestore (keeps About in sync)
        try{
          const snap = await getDoc(doc(db, "users", user.id));
          if (snap.exists()){
            const u = snap.data();
            user.name = u.name || user.name;
            user.about = u.about || "";
            saveLocalUser(user);
          }
        } catch {}
        showProfile(user);
      } else {
        showCreate();
      }

      createBtn.onclick = async () => {
        const name = (nameEl.value || "").trim().slice(0,20);
        if (!name){
          setHint(hintA, "Please enter a name.");
          return;
        }
        setHint(hintA, "Creating account…");

        try{
          const id = await generateUnique10DigitId();
          await setDoc(doc(db, "users", id), {
            id,
            name,
            about: "",
            createdAt: serverTimestamp()
          });

          user = { id, name, about: "" };
          saveLocalUser(user);
          showProfile(user);
          setHint(hintB, "Account created!");
        } catch(e){
          console.error(e);
          setHint(hintA, "Failed to create account. Check console.");
        }
      };

      goChatsBtnA.onclick = () => window.location.href = "./index.html";
      goChatsBtnB.onclick = () => window.location.href = "./index.html";

      copyIdBtn.onclick = async () => {
        if (!user?.id) return;
        await navigator.clipboard.writeText(user.id);
        setHint(hintB, "Copied your ID!");
      };

      editBtn.onclick = () => { if (user) showEditName(user); };
      cancelEditBtn.onclick = () => { editView.classList.add("hidden"); setHint(hintC, ""); };

      saveNameBtn.onclick = async () => {
        const newName = (newNameEl.value || "").trim().slice(0,20);
        if (!newName){
          setHint(hintC, "Name cannot be empty.");
          return;
        }
        setHint(hintC, "Saving…");

        try{
          await updateDoc(doc(db, "users", user.id), { name: newName });
          user.name = newName;
          saveLocalUser(user);
          showProfile(user);
          setHint(hintB, "Name updated!");
        } catch(e){
          console.error(e);
          setHint(hintC, "Failed to update name. Check console.");
        }
      };

      editAboutBtn.onclick = () => { if (user) showEditAbout(user); };
      cancelAboutBtn.onclick = () => { aboutEditView.classList.add("hidden"); setHint(hintD, ""); };

      saveAboutBtn.onclick = async () => {
        const about = (newAboutEl.value || "").trim().slice(0,160);
        setHint(hintD, "Saving…");

        try{
          await updateDoc(doc(db, "users", user.id), { about });
          user.about = about;
          saveLocalUser(user);
          showProfile(user);
          setHint(hintB, "About updated!");
        } catch(e){
          console.error(e);
          setHint(hintD, "Failed to update About. Check console.");
        }
      };

      deleteBtn.onclick = async () => {
        if (!user?.id) return;

        const ok = confirm("Delete your account? This removes your profile and signs you out on this device.");
        if (!ok) return;

        setHint(hintB, "Deleting account…");
        try { await deleteDoc(doc(db, "users", user.id)); }
        catch(e){ console.warn("Delete user doc failed:", e); }

        clearLocalUser();
        user = null;
        showCreate();
        setHint(hintA, "Account deleted. Create a new one to use Salad Chatt again.");
      };
    })();
  </script>
</body>
</html>
