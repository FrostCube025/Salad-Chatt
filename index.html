<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Salad Chatt</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <div class="badge">🥗</div>
        <div>
          <div class="h1">Salad Chatt</div>
          <div class="sub">Permanent chats • Contacts • WhatsApp-ish</div>
        </div>
      </div>

      <div class="rightTop">
        <div class="status" id="status">Loading…</div>
        <button id="accountBtn" class="btn">Account</button>
      </div>
    </header>

    <main class="appGrid">
      <!-- LEFT: contacts + chats -->
      <section class="card leftPane">
        <div class="cardTitle">Contacts</div>

        <div class="meBox">
          <div><span class="muted">You:</span> <strong id="meName">—</strong></div>
          <div><span class="muted">ID:</span> <strong id="meId" class="mono">—</strong></div>
        </div>

        <div class="newContact">
          <label class="lbl" for="addContactId">Add contact by ID</label>
          <div class="row">
            <input id="addContactId" class="inp" maxlength="10" inputmode="numeric" placeholder="10-digit ID" />
            <button id="addContactBtn" class="btn primary">Add</button>
          </div>
          <div class="hint" id="hint"></div>
        </div>

        <div id="contactList" class="list"></div>

        <div class="dividerSmall"></div>

        <div class="cardTitle">Chats</div>
        <div id="chatList" class="list"></div>
      </section>

      <!-- RIGHT: messages -->
      <section class="card rightPane">
        <div class="chatHeader">
          <div class="chatTitle" id="chatTitle">Select a chat</div>
          <div class="chatMeta" id="chatMeta">—</div>
          <span class="spacer"></span>
          <button id="deleteChatBtn" class="btn danger" disabled>Hide chat</button>
        </div>

        <div id="messages" class="messages"></div>

        <div id="replyBar" class="replyBar hidden">
          <div class="replyMeta">
            <div class="replyTitle">Replying to <span id="replyToName"></span></div>
            <div class="replyPreview" id="replyPreview"></div>
          </div>
          <button id="cancelReplyBtn" class="btn">Cancel</button>
        </div>

        <div class="composer">
          <input id="msg" class="inp" placeholder="Type a message…" disabled />
          <button id="sendBtn" class="btn primary" disabled>Send</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal hidden" aria-hidden="true">
    <div class="modalBackdrop" id="profileBackdrop"></div>
    <div class="modalCard" role="dialog" aria-modal="true">
      <div class="modalHeader">
        <div>
          <div class="modalTitle" id="profileName">—</div>
          <div class="modalSub mono" id="profileId">—</div>
        </div>
        <button class="btn" id="profileCloseBtn">Close</button>
      </div>

      <div class="modalBody">
        <div class="aboutBox">
          <strong>About</strong><br />
          <div id="profileAbout" style="margin-top:6px;">—</div>
        </div>

        <div class="row">
          <button class="btn primary" id="profileCopyBtn">Copy ID</button>
          <button class="btn" id="profileStartDmBtn">Start chat</button>
        </div>

        <div class="hint" id="profileHint"></div>
      </div>
    </div>
  </div>

  <!-- Context menu -->
  <div id="ctxMenu" class="ctxMenu hidden" role="menu" aria-hidden="true">
    <div class="ctxHeader" id="ctxHeader">Message</div>
    <div class="ctxSection">
      <div class="ctxLabel">React</div>
      <div class="ctxReacts" id="ctxReacts"></div>
    </div>
    <button class="ctxBtn" id="ctxReply">Reply</button>
    <button class="ctxBtn danger" id="ctxDelete">Delete</button>
    <button class="ctxBtn" id="ctxClose">Close</button>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
